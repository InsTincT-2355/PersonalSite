<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 875" font-family="Consolas, Menlo, 'Courier New', monospace">
  <rect width="1400" height="875" fill="#101010"/>
  <rect x="90" y="70" width="1220" height="735" rx="14" fill="#161616" stroke="#2c2c2c"/>
  <path d="M104 70 h1192 a14 14 0 0 1 14 14 v36 h-1220 v-36 a14 14 0 0 1 14 -14z" fill="#1d1d1d"/>
  <circle cx="122" cy="102" r="7" fill="#e06c5c"/><circle cx="146" cy="102" r="7" fill="#e3b45a"/><circle cx="170" cy="102" r="7" fill="#6fbf6a"/>
  <rect x="200" y="84" width="130" height="36" fill="#161616"/>
  <text x="222" y="108" fill="#f2efe9" font-size="16" font-family="Segoe UI, Arial, sans-serif">logic.html</text>
  <g font-size="21">
    <g fill="#5e5a54" text-anchor="end">
      <text x="160" y="176">1</text><text x="160" y="210">2</text><text x="160" y="244">3</text><text x="160" y="278">4</text><text x="160" y="312">5</text><text x="160" y="346">6</text><text x="160" y="380">7</text><text x="160" y="414">8</text><text x="160" y="448">9</text><text x="160" y="482">10</text><text x="160" y="516">11</text><text x="160" y="550">12</text><text x="160" y="584">13</text><text x="160" y="618">14</text><text x="160" y="652">15</text><text x="160" y="686">16</text><text x="160" y="720">17</text><text x="160" y="754">18</text>
    </g>
    <text x="190" y="176"><tspan fill="#6f6a62">&lt;</tspan><tspan fill="#c9a96e">script</tspan><tspan fill="#6f6a62">&gt;</tspan></text>
    <text x="230" y="210"><tspan fill="#f2efe9">x = </tspan><tspan fill="#e9d9b4">6</tspan><tspan fill="#f2efe9">;  y = </tspan><tspan fill="#e9d9b4">4</tspan><tspan fill="#f2efe9">;</tspan></text>
    <text x="230" y="244"><tspan fill="#e9d9b4">alert</tspan><tspan fill="#f2efe9">(x &gt; y)</tspan><tspan fill="#6f6a62">  // true</tspan></text>
    <text x="230" y="312"><tspan fill="#f2efe9">a = </tspan><tspan fill="#9fc28a">"Cat"</tspan><tspan fill="#f2efe9">;  b = </tspan><tspan fill="#9fc28a">"cat"</tspan><tspan fill="#f2efe9">;</tspan></text>
    <text x="230" y="346"><tspan fill="#e9d9b4">alert</tspan><tspan fill="#f2efe9">(a.</tspan><tspan fill="#e9d9b4">toLowerCase</tspan><tspan fill="#f2efe9">() != b)</tspan><tspan fill="#6f6a62">  // false: same after lowercasing</tspan></text>
    <text x="230" y="414"><tspan fill="#c9a96e">if</tspan><tspan fill="#f2efe9"> (x &gt; </tspan><tspan fill="#e9d9b4">10</tspan><tspan fill="#f2efe9">) {</tspan></text>
    <text x="270" y="448"><tspan fill="#e9d9b4">alert</tspan><tspan fill="#f2efe9">(</tspan><tspan fill="#9fc28a">"Very Good"</tspan><tspan fill="#f2efe9">)</tspan></text>
    <text x="230" y="482"><tspan fill="#f2efe9">} </tspan><tspan fill="#c9a96e">else</tspan><tspan fill="#f2efe9"> {</tspan></text>
    <text x="270" y="516"><tspan fill="#e9d9b4">alert</tspan><tspan fill="#f2efe9">(</tspan><tspan fill="#9fc28a">"too bad"</tspan><tspan fill="#f2efe9">)</tspan></text>
    <text x="230" y="550" fill="#f2efe9">}</text>
    <text x="230" y="618" fill="#6f6a62">// 50/50 chance to get a "boo"</text>
    <text x="230" y="652"><tspan fill="#f2efe9">z = Math.</tspan><tspan fill="#e9d9b4">round</tspan><tspan fill="#f2efe9">(Math.</tspan><tspan fill="#e9d9b4">random</tspan><tspan fill="#f2efe9">());</tspan></text>
    <text x="230" y="686"><tspan fill="#c9a96e">if</tspan><tspan fill="#f2efe9"> (z == </tspan><tspan fill="#e9d9b4">0</tspan><tspan fill="#f2efe9">) { </tspan><tspan fill="#e9d9b4">alert</tspan><tspan fill="#f2efe9">(</tspan><tspan fill="#9fc28a">"boo"</tspan><tspan fill="#f2efe9">) }</tspan></text>
    <text x="190" y="754"><tspan fill="#6f6a62">&lt;/</tspan><tspan fill="#c9a96e">script</tspan><tspan fill="#6f6a62">&gt;</tspan></text>
  </g>
</svg>
