    <text x="190" y="176"><tspan fill="#c9a96e">import</tspan><tspan fill="#f2efe9"> db</tspan></text>
    <text x="190" y="210"><tspan fill="#c9a96e">from</tspan><tspan fill="#f2efe9"> objects </tspan><tspan fill="#c9a96e">import</tspan><tspan fill="#f2efe9"> Task, TaskList</tspan></text>
    <text x="190" y="278" fill="#6f6a62"># Adds a task</text>
    <text x="190" y="312"><tspan fill="#c9a96e">def</tspan><tspan fill="#e9d9b4"> add_task</tspan><tspan fill="#f2efe9">(tasks):</tspan></text>
    <text x="230" y="346"><tspan fill="#f2efe9">description = </tspan><tspan fill="#e9d9b4">input</tspan><tspan fill="#f2efe9">(</tspan><tspan fill="#9fc28a">"Task description: "</tspan><tspan fill="#f2efe9">)</tspan></text>
    <text x="230" y="380"><tspan fill="#f2efe9">task = </tspan><tspan fill="#e9d9b4">Task</tspan><tspan fill="#f2efe9">(description)</tspan></text>
    <text x="230" y="414" fill="#f2efe9">tasks.addTask(task)</text>
    <text x="190" y="482" fill="#6f6a62"># Marks task as done</text>
    <text x="190" y="516"><tspan fill="#c9a96e">def</tspan><tspan fill="#e9d9b4"> complete_task</tspan><tspan fill="#f2efe9">(tasks):</tspan></text>
    <text x="230" y="550"><tspan fill="#f2efe9">number = </tspan><tspan fill="#e9d9b4">int</tspan><tspan fill="#f2efe9">(</tspan><tspan fill="#e9d9b4">input</tspan><tspan fill="#f2efe9">(</tspan><tspan fill="#9fc28a">"Number: "</tspan><tspan fill="#f2efe9">))</tspan></text>
    <text x="230" y="584" fill="#f2efe9">task = tasks.getTask(number)</text>
    <text x="230" y="618"><tspan fill="#f2efe9">task.completed = </tspan><tspan fill="#c9a96e">True</tspan></text>
    <text x="230" y="652"><tspan fill="#e9d9b4">print</tspan><tspan fill="#f2efe9">(</tspan><tspan fill="#9fc28a">f'Task "{task.description}" completed.'</tspan><tspan fill="#f2efe9">)</tspan></text>
    <text x="190" y="720"><tspan fill="#c9a96e">def</tspan><tspan fill="#e9d9b4"> main</tspan><tspan fill="#f2efe9">():</tspan></text>
    <text x="230" y="754"><tspan fill="#f2efe9">display_menu()</tspan><tspan fill="#6f6a62">  # list · add · complete · delete · exit</tspan></text>
