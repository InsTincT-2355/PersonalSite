<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 875" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%"><stop offset="0" stop-color="#2a2418"/><stop offset="1" stop-color="#0f0f0f"/></radialGradient>
  </defs>
  <rect width="1400" height="875" fill="url(#glow)"/>

  <!-- Phone 1: home / flight overview -->
  <g transform="translate(370 110)">
    <rect width="310" height="650" rx="44" fill="#050505" stroke="#3a3a3a" stroke-width="3"/>
    <rect x="12" y="12" width="286" height="626" rx="34" fill="#151515"/>
    <rect x="115" y="22" width="80" height="18" rx="9" fill="#050505"/>
    <text x="34" y="80" fill="#9a958c" font-size="13">Welcome back</text>
    <text x="34" y="106" fill="#f2efe9" font-size="22" font-weight="700">Your next flight</text>
    <rect x="28" y="126" width="254" height="150" rx="16" fill="#1f1b13" stroke="#c9a96e" stroke-opacity=".5"/>
    <text x="48" y="168" fill="#f2efe9" font-size="30" font-weight="700">MCT</text>
    <text x="202" y="168" fill="#f2efe9" font-size="30" font-weight="700">LHR</text>
    <path d="M128 158 h44" stroke="#c9a96e" stroke-width="2" stroke-dasharray="4 4"/>
    <path d="M150 152 l8 6 -8 6" fill="none" stroke="#c9a96e" stroke-width="2"/>
    <text x="48" y="200" fill="#9a958c" font-size="12">Muscat</text><text x="202" y="200" fill="#9a958c" font-size="12">London</text>
    <text x="48" y="240" fill="#9a958c" font-size="12">Boarding</text><text x="48" y="260" fill="#f2efe9" font-size="15" font-weight="600">14:35</text>
    <text x="140" y="240" fill="#9a958c" font-size="12">Seat</text><text x="140" y="260" fill="#f2efe9" font-size="15" font-weight="600">12C</text>
    <rect x="200" y="243" width="66" height="22" rx="11" fill="#2f6b3c"/><text x="233" y="258" fill="#d7f5dc" font-size="11" text-anchor="middle" font-weight="600">On time</text>
    <text x="34" y="314" fill="#9a958c" font-size="12" letter-spacing="1.5">QUICK ACTIONS</text>
    <g font-size="13" fill="#f2efe9" text-anchor="middle">
      <rect x="28" y="328" width="122" height="78" rx="14" fill="#c9a96e"/><text x="89" y="374" fill="#0a0a0a" font-weight="700">Reserve bin</text>
      <rect x="160" y="328" width="122" height="78" rx="14" fill="#1f1f1f"/><text x="221" y="374">Flight status</text>
      <rect x="28" y="416" width="122" height="78" rx="14" fill="#1f1f1f"/><text x="89" y="462">Bag rules</text>
      <rect x="160" y="416" width="122" height="78" rx="14" fill="#1f1f1f"/><text x="221" y="462">Help desk</text>
    </g>
    <rect x="28" y="512" width="254" height="56" rx="12" fill="#1f1f1f"/>
    <circle cx="52" cy="540" r="6" fill="#c9a96e"/>
    <text x="68" y="536" fill="#f2efe9" font-size="12" font-weight="600">Gate changed to B4</text>
    <text x="68" y="554" fill="#9a958c" font-size="11">2 min ago</text>
    <g fill="#5b5b5b"><circle cx="80" cy="604" r="4"/><circle cx="130" cy="604" r="4"/><circle cx="180" cy="604" r="4"/><circle cx="230" cy="604" r="4"/></g>
    <circle cx="80" cy="604" r="4" fill="#c9a96e"/>
  </g>

  <!-- Phone 2: carry-on bin map -->
  <g transform="translate(730 110)">
    <rect width="310" height="650" rx="44" fill="#050505" stroke="#3a3a3a" stroke-width="3"/>
    <rect x="12" y="12" width="286" height="626" rx="34" fill="#151515"/>
    <rect x="115" y="22" width="80" height="18" rx="9" fill="#050505"/>
    <text x="34" y="80" fill="#9a958c" font-size="13">Flight 214 · MCT → LHR</text>
    <text x="34" y="106" fill="#f2efe9" font-size="22" font-weight="700">Pick a bin</text>
    <path d="M155 128 C 95 150, 80 190, 80 230 V 470 H 230 V 230 C 230 190, 215 150, 155 128 Z" fill="#1b1b1b" stroke="#3a3a3a" stroke-width="2"/>
    <g>
      <!-- rows of overhead bins: left & right of the aisle -->
      <rect x="96" y="214" width="46" height="22" rx="5" fill="#5f5f5f"/><rect x="168" y="214" width="46" height="22" rx="5" fill="#2f8a47"/>
      <rect x="96" y="246" width="46" height="22" rx="5" fill="#b23b3b"/><rect x="168" y="246" width="46" height="22" rx="5" fill="#2f8a47"/>
      <rect x="96" y="278" width="46" height="22" rx="5" fill="#2f8a47"/><rect x="168" y="278" width="46" height="22" rx="5" fill="#b23b3b"/>
      <rect x="96" y="310" width="46" height="22" rx="5" fill="#c9a96e" stroke="#f2e2bd" stroke-width="2"/><rect x="168" y="310" width="46" height="22" rx="5" fill="#b23b3b"/>
      <rect x="96" y="342" width="46" height="22" rx="5" fill="#2f8a47"/><rect x="168" y="342" width="46" height="22" rx="5" fill="#5f5f5f"/>
      <rect x="96" y="374" width="46" height="22" rx="5" fill="#b23b3b"/><rect x="168" y="374" width="46" height="22" rx="5" fill="#2f8a47"/>
      <rect x="96" y="406" width="46" height="22" rx="5" fill="#2f8a47"/><rect x="168" y="406" width="46" height="22" rx="5" fill="#b23b3b"/>
      <line x1="155" y1="206" x2="155" y2="440" stroke="#2c2c2c" stroke-dasharray="3 5"/>
      <text x="119" y="326" fill="#0a0a0a" font-size="11" font-weight="700" text-anchor="middle">12C</text>
    </g>
    <g font-size="11" fill="#cfcac1">
      <rect x="34" y="488" width="12" height="12" rx="3" fill="#2f8a47"/><text x="52" y="498">Available</text>
      <rect x="122" y="488" width="12" height="12" rx="3" fill="#b23b3b"/><text x="140" y="498">Taken</text>
      <rect x="196" y="488" width="12" height="12" rx="3" fill="#5f5f5f"/><text x="214" y="498">Unavailable</text>
    </g>
    <rect x="28" y="522" width="254" height="44" rx="12" fill="#1f1f1f"/>
    <text x="44" y="549" fill="#f2efe9" font-size="13">Bin above seat 12C</text>
    <text x="268" y="549" fill="#c9a96e" font-size="13" font-weight="700" text-anchor="end">Selected</text>
    <rect x="28" y="578" width="254" height="44" rx="12" fill="#c9a96e"/>
    <text x="155" y="606" fill="#0a0a0a" font-size="14" font-weight="700" text-anchor="middle">Confirm &amp; get QR pass</text>
  </g>
</svg>
