<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <radialGradient id="bg" cx="75%" cy="45%" r="80%"><stop offset="0" stop-color="#1f1b14"/><stop offset=".55" stop-color="#111111"/><stop offset="1" stop-color="#0a0a0a"/></radialGradient>
    <linearGradient id="gold" x1="0" x2="1"><stop offset="0" stop-color="#e2c48a"/><stop offset="1" stop-color="#b8935a"/></linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Title block -->
  <text x="110" y="250" fill="#c9a96e" font-size="22" font-weight="700" letter-spacing="6">MURIYA TOURISM DEVELOPMENT</text>
  <text x="104" y="390" fill="#f2efe9" font-size="150" font-family="Georgia, 'Times New Roman', serif">Nexus</text>
  <text x="110" y="470" fill="url(#gold)" font-size="54" font-style="italic" font-family="Georgia, 'Times New Roman', serif">Every tool, one place</text>
  <text x="110" y="540" fill="#9a958c" font-size="26">Role-based access · Task planner · AI assistant</text>

  <!-- Hub: center node with connected tiles -->
  <g transform="translate(1130 430)">
    <g stroke="#c9a96e" stroke-opacity=".35" stroke-width="2">
      <line x1="0" y1="0" x2="-230" y2="-200"/><line x1="0" y1="0" x2="0" y2="-250"/><line x1="0" y1="0" x2="230" y2="-200"/>
      <line x1="0" y1="0" x2="-230" y2="200"/><line x1="0" y1="0" x2="0" y2="250"/><line x1="0" y1="0" x2="230" y2="200"/>
    </g>
    <g fill="#161616" stroke="#2e2e2e" stroke-width="2">
      <rect x="-290" y="-255" width="120" height="110" rx="18"/>
      <rect x="-60" y="-305" width="120" height="110" rx="18"/>
      <rect x="170" y="-255" width="120" height="110" rx="18"/>
      <rect x="-290" y="145" width="120" height="110" rx="18"/>
      <rect x="-60" y="195" width="120" height="110" rx="18"/>
      <rect x="170" y="145" width="120" height="110" rx="18"/>
    </g>
    <g fill="none" stroke="#c9a96e" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
      <!-- support headset -->
      <path d="M-252 -195 a22 22 0 0 1 44 0 M-256 -197 v14 M-204 -197 v14"/>
      <!-- calendar / planner -->
      <rect x="-22" y="-272" width="44" height="44" rx="6"/><path d="M-22 -258 h44 M-10 -278 v10 M10 -278 v10"/>
      <!-- chart / ERP -->
      <path d="M208 -178 v-36 M224 -178 v-24 M240 -178 v-44 M256 -178 v-16"/>
      <!-- globe / websites -->
      <circle cx="-230" cy="200" r="22"/><path d="M-252 200 h44 M-230 178 c-12 14 -12 30 0 44 c12 -14 12 -30 0 -44"/>
      <!-- document -->
      <path d="M-14 230 h20 l12 12 v30 h-32 z M6 230 v12 h12"/>
      <!-- chat / AI -->
      <path d="M206 186 h48 v30 h-28 l-12 10 v-10 h-8 z"/>
    </g>
    <circle r="92" fill="#1c1813" stroke="url(#gold)" stroke-width="3"/>
    <text y="-6" fill="#f2efe9" font-size="30" font-weight="700" text-anchor="middle">NEXUS</text>
    <text y="26" fill="#c9a96e" font-size="15" letter-spacing="3" text-anchor="middle">2FA SECURED</text>
  </g>

  <!-- Play button -->
  <g transform="translate(160 680)">
    <circle r="50" fill="#c9a96e"/>
    <path d="M-15 -24 L28 0 L-15 24 Z" fill="#0a0a0a"/>
  </g>
  <text x="240" y="672" fill="#cfcac1" font-size="24">Built for the whole company</text>
  <text x="240" y="706" fill="#6f6a62" font-size="20">Watch the walkthrough</text>
</svg>
