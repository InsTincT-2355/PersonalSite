<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <radialGradient id="bg" cx="78%" cy="30%" r="80%"><stop offset="0" stop-color="#2a2215"/><stop offset=".55" stop-color="#121110"/><stop offset="1" stop-color="#0a0a0a"/></radialGradient>
    <linearGradient id="gold" x1="0" x2="1"><stop offset="0" stop-color="#e2c48a"/><stop offset="1" stop-color="#b8935a"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e2c48a"/><stop offset="1" stop-color="#8a6d3b"/></linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g stroke="#ffffff" stroke-opacity=".035"><path d="M0 150H1600M0 300H1600M0 450H1600M0 600H1600M0 750H1600"/></g>

  <!-- Title block -->
  <text x="110" y="250" fill="#c9a96e" font-size="22" font-weight="700" letter-spacing="6">MY BUSINESS · BUILT BY ME</text>
  <text x="104" y="390" fill="#f2efe9" font-size="150" font-family="Georgia, 'Times New Roman', serif">Studio 21</text>
  <text x="110" y="470" fill="url(#gold)" font-size="54" font-style="italic" font-family="Georgia, 'Times New Roman', serif">Finance Dashboard</text>
  <text x="110" y="540" fill="#9a958c" font-size="26">Sales · Expenses · Barber performance · Cash to collect</text>

  <!-- Scissors mark -->
  <g transform="translate(110 610)" fill="none" stroke="#c9a96e" stroke-width="4" stroke-linecap="round">
    <circle cx="22" cy="78" r="18"/><circle cx="78" cy="78" r="18"/>
    <path d="M34 64 L86 4 M66 64 L14 4"/>
  </g>
  <text x="240" y="672" fill="#cfcac1" font-size="24">Owned &amp; operated in Muscat</text>
  <text x="240" y="706" fill="#6f6a62" font-size="20">Watch the walkthrough</text>

  <!-- Floating KPI cards -->
  <g transform="translate(1000 170)">
    <rect width="440" height="560" rx="22" fill="#151515" stroke="#2e2e2e"/>
    <text x="34" y="62" fill="#9a958c" font-size="18" letter-spacing="2">THIS MONTH</text>
    <text x="34" y="122" fill="#f2efe9" font-size="52" font-weight="700">Revenue</text>
    <rect x="34" y="150" width="120" height="6" rx="3" fill="url(#gold)"/>
    <g>
      <rect x="44"  y="380" width="44" height="110" rx="6" fill="url(#bar)" opacity=".55"/>
      <rect x="108" y="330" width="44" height="160" rx="6" fill="url(#bar)" opacity=".65"/>
      <rect x="172" y="350" width="44" height="140" rx="6" fill="url(#bar)" opacity=".75"/>
      <rect x="236" y="280" width="44" height="210" rx="6" fill="url(#bar)" opacity=".85"/>
      <rect x="300" y="300" width="44" height="190" rx="6" fill="url(#bar)" opacity=".9"/>
      <rect x="364" y="230" width="44" height="260" rx="6" fill="url(#bar)"/>
    </g>
    <path d="M66 360 L130 312 L194 330 L258 262 L322 280 L386 210" fill="none" stroke="#f2efe9" stroke-width="3" stroke-opacity=".7"/>
    <g fill="#f2efe9"><circle cx="66" cy="360" r="5"/><circle cx="130" cy="312" r="5"/><circle cx="194" cy="330" r="5"/><circle cx="258" cy="262" r="5"/><circle cx="322" cy="280" r="5"/><circle cx="386" cy="210" r="7" fill="#c9a96e"/></g>
    <line x1="34" y1="510" x2="406" y2="510" stroke="#2e2e2e"/>
  </g>
  <g transform="translate(860 560)">
    <rect width="250" height="130" rx="18" fill="#1c1813" stroke="#c9a96e" stroke-opacity=".5"/>
    <text x="26" y="50" fill="#9a958c" font-size="16" letter-spacing="2">TOP BARBER</text>
    <text x="26" y="96" fill="#f2efe9" font-size="34" font-weight="700">62% share</text>
  </g>

  <!-- Play button -->
  <g transform="translate(1220 735)">
    <circle r="54" fill="#c9a96e"/>
    <path d="M-16 -26 L30 0 L-16 26 Z" fill="#0a0a0a"/>
  </g>
</svg>
